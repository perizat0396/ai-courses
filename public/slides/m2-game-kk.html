<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2-сабақ: ChatGPT — ойын-микрокурс</title>
<style>
:root{--ink:#14213D;--soft:#4A5568;--line:#DCE3EC;--bg:#F4F7FB;--blue:#2563EB;--teal:#0E9F8E;--purple:#7C3AED;--gold:#F5B301;--ok:#16A34A;--bad:#DC2626}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:19px;line-height:1.55}
button{font:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 28px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:24px;margin:0;flex:1;min-width:220px}
.stars{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;white-space:nowrap}
.bar{height:12px;background:#E3E8F0;border-radius:99px;overflow:hidden;margin:4px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue),var(--purple));border-radius:99px;transition:width .8s}
.map{display:grid;gap:12px}
.lv{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 16px;text-align:left;width:100%;transition:transform .2s,box-shadow .2s}
.lv:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,33,61,.08)}
.lv .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex-shrink:0;background:#EAF1FF}
.lv.done .ic{background:#E6F7EF}
.lv:disabled{opacity:.5;cursor:not-allowed}
.lv .nm{flex:1}
.lv .nm b{display:block;font-size:19px}
.lv .nm small{color:var(--soft);font-size:15px}
.lv .st{font-size:20px;letter-spacing:2px;white-space:nowrap}
.part{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--purple);margin:10px 0 0}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px 18px;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h2{margin:0 0 4px;font-size:26px;line-height:1.25}
.lvl{color:var(--teal);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.05em}
.blk{margin:16px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tile{background:var(--bg);border-radius:16px;padding:12px 14px}
.tile .e{font-size:26px}
.tile b{display:block}
.tile span{color:var(--soft);font-size:16px}
.warn{background:#FFF7E0;border-left:6px solid var(--gold);border-radius:12px;padding:12px 14px}
.info{background:#E8F7F5;border-left:6px solid var(--teal);border-radius:12px;padding:12px 14px}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:0}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 52px;min-height:44px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;display:grid;place-items:center}
.shot{position:relative;margin:0 auto;border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#111}
.shot img{display:block;width:100%;height:auto}
.spot{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:var(--gold);color:#111;font-weight:900;border:3px solid #fff;box-shadow:0 0 0 0 rgba(245,179,1,.7);animation:pulse 2s infinite;display:grid;place-items:center;font-size:18px;padding:0}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,179,1,.7)}70%{box-shadow:0 0 0 14px rgba(245,179,1,0)}100%{box-shadow:0 0 0 0 rgba(245,179,1,0)}}
.spot.on{background:var(--purple);color:#fff;animation:none}
.legend{display:grid;gap:8px;margin-top:10px}
.legend button{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:8px 12px}
.legend button.on{border-color:var(--purple);background:#F3EDFF}
.legend i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--gold);font-weight:900;display:grid;place-items:center;flex-shrink:0}
.cap{color:var(--soft);font-size:15px;text-align:center;margin-top:6px}
.prompt{background:#F1F5FF;border:2px dashed #A9C1F5;border-radius:16px;padding:14px;white-space:pre-wrap}
.copy{margin-top:10px;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700}
.copy.ok{background:var(--ok)}
.dl{display:inline-flex;align-items:center;gap:10px;background:var(--teal);color:#fff;text-decoration:none;border-radius:14px;padding:12px 20px;font-weight:800}
.task{display:flex;gap:12px;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;text-align:left}
.task .bx{width:32px;height:32px;border-radius:10px;border:3px solid var(--soft);flex-shrink:0;display:grid;place-items:center;font-weight:900;color:#fff}
.task.on{border-color:var(--ok);background:#E6F7EF}
.task.on .bx{background:var(--ok);border-color:var(--ok)}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.flip{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;min-height:120px}
.flip b{display:block;margin-bottom:6px}
.flip .back{display:none;color:var(--soft);font-size:16px}
.flip.on{background:#F3EDFF;border-color:var(--purple)}
.flip.on .back{display:block}
.flip .hint{font-size:14px;color:var(--purple);font-weight:700}
.flip.on .hint{display:none}
.quiz{margin-top:22px;background:linear-gradient(135deg,#EEF3FF,#F3EDFF);border-radius:20px;padding:18px}
.quiz h3{margin:0 0 10px;font-size:20px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.opt.ok{border-color:var(--ok);background:#E6F7EF}
.opt.bad{border-color:var(--bad);background:#FDECEC;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.why{margin-top:8px;font-weight:600}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:800;font-size:19px}
.btn.main{background:var(--purple);color:#fff;flex:1}
.btn.main:disabled{background:#C9CFDA;cursor:not-allowed}
.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
.need{color:var(--soft);font-size:15px;margin-top:8px}
.final{text-align:center}
.badge{width:170px;height:170px;margin:10px auto;border-radius:50%;background:conic-gradient(var(--teal),var(--blue),var(--purple),var(--teal));display:grid;place-items:center;animation:pop .8s ease}
.badge div{width:140px;height:140px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:60px}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.toast{position:absolute;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:12px 20px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (max-width:520px){html,body{font-size:18px}.card{padding:16px 14px}.card h2{font-size:23px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>

function header(){const p=Math.round(total()/max*100);return `<div class="top"><h1>${esc(T.title)}</h1><div class="stars">⭐ ${total()} / ${max}</div></div><div class="bar"><i style="width:${p}%"></i></div>`}
function map(){S.cur=null;save();let h=header(),part='';
 L.forEach((l,i)=>{if(l.part!==part){part=l.part;h+=`<div class="part">${esc(part)}</div>`}
  const d=done(i),o=open(i);
  h+=`<button class="lv ${d?'done':''}" ${o?'':'disabled'} onclick="go(${i})"><span class="ic">${o?l.icon:'🔒'}</span><span class="nm"><b>${i+1}. ${esc(l.title)}</b><small>${d?T.done:o?T.start:T.locked}</small></span><span class="st">${d?starStr(S.stars[l.id]):''}</span></button>`});
 const fin=L.every((_,i)=>done(i));
 h+=`<div class="part">🏁</div><button class="lv ${fin?'done':''}" ${fin?'':'disabled'} onclick="final()"><span class="ic">${fin?'🏅':'🔒'}</span><span class="nm"><b>${esc(T.finalTitle)}</b><small>${fin?T.start:T.finalLocked}</small></span></button>`;
 app.innerHTML=`<div class="map">${h}</div>`;scrollTo(0,0);up();sendH()}
function blk(b,li){switch(b.t){
 case 'p':return `<div class="blk">${b.h}</div>`;
 case 'warn':return `<div class="blk warn">${b.h}</div>`;
 case 'info':return `<div class="blk info">${b.h}</div>`;
 case 'tiles':return `<div class="blk tiles">${b.items.map(x=>`<div class="tile"><div class="e">${x[0]}</div><b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div>`;
 case 'steps':return `<div class="blk"><ol class="steps">${b.items.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
 case 'shot':{const id='s'+Math.random().toString(36).slice(2,7);
  return `<div class="blk"><div class="shot" id="${id}" style="max-width:${b.max||360}px"><img src="${b.src}" alt="${esc(b.alt||'')}">${b.spots.map((s,k)=>`<button class="spot" style="left:${s[0]}%;top:${s[1]}%" onclick="spot('${id}',${k})">${k+1}</button>`).join('')}</div><div class="cap">${esc(b.cap||'')}</div><div class="legend" id="${id}L">${b.spots.map((s,k)=>`<button onclick="spot('${id}',${k})"><i>${k+1}</i><span>${s[2]}</span></button>`).join('')}</div></div>`}
 case 'prompt':return `<div class="blk"><div class="prompt">${esc(b.text)}</div><button class="copy" onclick="cp(this)" data-t="${esc(b.text)}">📋 ${T.copy}</button></div>`;
 case 'dl':return `<div class="blk"><a class="dl" href="${b.href}" ${b.dl?'download':''} target="_blank" rel="noopener">⬇️ ${esc(b.label)}</a>${b.note?`<div class="need">${esc(b.note)}</div>`:''}</div>`;
 case 'task':{const on=S.tasks[b.id];return `<div class="blk"><button class="task ${on?'on':''}" onclick="tk(this,'${b.id}',${li})"><span class="bx">${on?'✓':''}</span><span>${b.label}</span></button></div>`}
 case 'flips':return `<div class="blk flips">${b.items.map(x=>`<button class="flip" onclick="this.classList.toggle('on');sendH()"><b>${x[0]}</b><span class="hint">${T.flip}</span><span class="back">${x[1]}</span></button>`).join('')}</div>`;
 case 'h':return `<h3 style="margin:22px 0 6px;font-size:21px">${b.h}</h3>`;
 }return ''}
function go(i){if(!open(i))return;S.cur=i;save();const l=L[i];
 let h=`<div class="card"><div class="lvl">${T.level} ${i+1} / ${L.length} · ${esc(l.part)}</div><h2>${l.icon} ${esc(l.title)}</h2>`;
 h+=l.blocks.map(b=>blk(b,i)).join('');
 if(l.quiz){h+=`<div class="quiz"><h3>❓ ${esc(l.quiz.q)}</h3>${l.quiz.opts.map((o,k)=>`<button class="opt" onclick="ans(this,${i},${k})">${esc(o)}</button>`).join('')}<div class="why" id="why"></div></div>`}
 h+=`<div class="nav"><button class="btn ghost" onclick="map()">🗺️ ${T.map}</button><button class="btn main" id="nx" onclick="next(${i})" ${done(i)?'':'disabled'}>${i===L.length-1?T.toFinal:T.next} →</button></div>`;
 h+=`<div class="need" id="need">${done(i)?'':(l.quiz?T.needQuiz:T.needTasks)}</div></div>`;
 app.innerHTML=header()+h;window.tries=0;scrollTo(0,0);up();sendH()}
function spot(id,k){document.querySelectorAll('#'+id+' .spot').forEach((s,j)=>s.classList.toggle('on',j===k));document.querySelectorAll('#'+id+'L button').forEach((s,j)=>s.classList.toggle('on',j===k))}
function cp(b){const t=b.dataset.t;const okf=()=>{b.classList.add('ok');b.textContent='✅ '+T.copied;setTimeout(()=>{b.classList.remove('ok');b.textContent='📋 '+T.copy},1800)};
 if(navigator.clipboard&&isSecureContext){navigator.clipboard.writeText(t).then(okf,()=>fb())}else fb();
 function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');okf()}catch(e){}a.remove()}}
function tk(b,id,i){S.tasks[id]=!S.tasks[id];b.classList.toggle('on',!!S.tasks[id]);b.querySelector('.bx').textContent=S.tasks[id]?'✓':'';
 const l=L[i],ids=l.blocks.filter(x=>x.t==='task').map(x=>x.id),n=ids.filter(x=>S.tasks[x]).length;
 if(!l.quiz){if(n===ids.length){if(S.stars[l.id]==null)toast('⭐⭐⭐ '+T.great,b);S.stars[l.id]=3;$('#nx').disabled=false;$('#need').textContent=''}else{delete S.stars[l.id];$('#nx').disabled=true;$('#need').textContent=T.needTasks}}
 save();const st=document.querySelector('.stars');if(st)st.textContent='⭐ '+total()+' / '+max}
function ans(b,i,k){const l=L[i],q=l.quiz;if(document.querySelector('.opt.ok'))return;
 if(k===q.ok){b.classList.add('ok');const s=Math.max(1,3-window.tries);if(S.stars[l.id]==null||S.stars[l.id]<s)S.stars[l.id]=s;save();
  $('#why').innerHTML='✅ '+esc(q.why);$('#nx').disabled=false;$('#need').textContent='';toast(starStr(S.stars[l.id])+' '+T.great,b);document.querySelector('.stars').textContent='⭐ '+total()+' / '+max}
 else{window.tries++;b.classList.add('bad');$('#why').innerHTML='🙂 '+esc(T.tryAgain);setTimeout(()=>b.classList.remove('bad'),600)}sendH()}
function next(i){if(i<L.length-1)go(i+1);else final()}
function final(){if(!L.every((_,i)=>done(i)))return map();
 app.innerHTML=header()+`<div class="card final"><div class="badge"><div>🏅</div></div><h2>${esc(T.finalTitle)}</h2><p>${T.finalText.replace('{s}',total()).replace('{m}',max)}</p><div class="info" style="text-align:left">${T.homework}</div><div class="nav"><button class="btn ghost" onclick="map()">🗺️ ${T.map}</button><button class="btn ghost" onclick="if(confirm('${esc(T.resetQ)}')){S={stars:{},tasks:{},cur:null};save();map()}">↺ ${T.reset}</button></div></div>`;scrollTo(0,0);up();sendH()}
if(S.cur!=null&&open(S.cur))go(S.cur);else map();ready=true;
</script>
</body>
</html>
