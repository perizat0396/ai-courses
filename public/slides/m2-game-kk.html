<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2-сабақ: ChatGPT — ойын-микрокурс</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2350;--soft:#56607F;--line:#E1E6F0;--bg:#F3F5FA;--paper:#fff;--teal:#0EA5A0;--blue:#3657E8;--violet:#7B61FF;--gold:#E9A824;--goldl:#FFF4D6;--ok:#12A15E;--bad:#E0473B;
 --disp:"Unbounded",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--r:22px;--sh:0 1px 2px rgba(27,35,80,.06),0 8px 24px rgba(27,35,80,.07)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:12px}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wrap{max-width:780px;margin:0 auto;padding:16px 12px 28px}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 22px 20px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#7B61FF 0%,#3657E8 45%,#1B2350 100%);box-shadow:var(--sh)}
.orn{position:absolute;opacity:.15;pointer-events:none}
.hero .orn{right:-30px;top:-30px;width:190px}
.eyebrow{font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero h1{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.2;margin:6px 0 14px;max-width:520px}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 14px;font-weight:800}
.pill .st svg{color:#FFD166;fill:#FFD166}
.prog{flex:1;min-width:160px;height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFD166,#E9A824);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.sect{display:flex;align-items:center;gap:10px;margin:26px 4px 8px;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.sect::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.route{position:relative;padding-left:8px}
.route::before{content:"";position:absolute;left:43px;top:30px;bottom:30px;width:4px;border-radius:4px;background:repeating-linear-gradient(180deg,#CCD4E6 0 10px,transparent 10px 18px)}
.node{position:relative;display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;padding:8px 0;text-align:left}
.med{position:relative;z-index:1;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff;flex-shrink:0;box-shadow:0 6px 16px rgba(27,35,80,.18);border:4px solid #fff;transition:transform .25s}
.th .med{background:linear-gradient(145deg,#19C3BC,#3657E8)}
.pr .med{background:linear-gradient(145deg,#9B7BFF,#E0569B)}
.node.done .med{background:linear-gradient(145deg,#F6C24A,#E08E0B)}
.node.lock .med{background:#DCE1EC;color:#9AA3BA;box-shadow:none}
.node.now .med::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--gold);animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
.node:not(.lock):hover .med{transform:scale(1.06)}
.lab{flex:1;background:var(--paper);border-radius:18px;padding:12px 16px;box-shadow:var(--sh);border:2px solid transparent}
.node.now .lab{border-color:var(--gold)}
.node.lock .lab{background:#F7F8FB;box-shadow:none;color:#98A0B6}
.lab b{display:block;font-weight:800;font-size:18px;line-height:1.3}
.lab small{display:flex;align-items:center;gap:6px;color:var(--soft);font-size:15px;margin-top:3px}
.stars3{display:inline-flex;gap:2px;font-size:18px}
.stars3 .on svg{color:var(--gold);fill:var(--gold)}
.stars3 .off svg{color:#CDD3E1}
.node.fin .med{width:84px;height:84px;font-size:36px;margin-left:-6px}
.lvtop{position:relative;overflow:hidden;border-radius:28px;padding:22px;color:#fff;display:flex;gap:16px;align-items:center;box-shadow:var(--sh);animation:rise .5s cubic-bezier(.2,.8,.2,1)}
.lvtop.th{background:linear-gradient(135deg,#0EA5A0,#3657E8)}
.lvtop.pr{background:linear-gradient(135deg,#7B61FF,#D9468F)}
.lvtop .orn{right:-40px;bottom:-50px;width:180px}
.lvtop .big{width:76px;height:76px;border-radius:24px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:38px;flex-shrink:0}
.lvtop h2{font-family:var(--disp);font-weight:700;font-size:24px;line-height:1.2;margin:4px 0 0}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.body{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:6px 20px 20px;margin-top:14px;animation:rise .6s .05s both cubic-bezier(.2,.8,.2,1)}
.blk{margin:18px 0}
.blk p{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.tile{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:16px;padding:12px 14px}
.tile .ti{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:22px;flex-shrink:0;box-shadow:0 2px 6px rgba(27,35,80,.08)}
.tile.neg .ti{color:var(--bad)}
.tile b{display:block;line-height:1.3}
.tile span{color:var(--soft);font-size:16px;line-height:1.4}
.note{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px 16px}
.note .ni{font-size:24px;line-height:1;margin-top:2px}
.note.warn{background:var(--goldl);color:#5A4203}
.note.warn .ni{color:#C88A06}
.note.info{background:#E5F6F5;color:#0B4F4C}
.note.info .ni{color:var(--teal)}
ol.steps{padding:0;list-style:none;counter-reset:s;margin:0}
ol.steps li{counter-increment:s;position:relative;padding:9px 0 9px 54px;min-height:46px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:38px;height:38px;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;display:grid;place-items:center}
.phone{position:relative;margin:0 auto;padding:10px;border-radius:38px;background:#111521;box-shadow:0 18px 40px rgba(27,35,80,.25),inset 0 0 0 2px #2A3045}
.phone .scr{position:relative;border-radius:28px;overflow:hidden;background:#000}
.phone img{display:block;width:100%;height:auto}
.spot{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:var(--gold);color:#1B2350;font-weight:800;border:3px solid #fff;display:grid;place-items:center;font-size:17px;padding:0;box-shadow:0 4px 10px rgba(0,0,0,.35);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-50%) scale(1.1)}}
.spot.on{background:var(--violet);color:#fff;animation:none;transform:translate(-50%,-50%) scale(1.15)}
.cap{color:var(--soft);font-size:15px;text-align:center;margin-top:10px}
.legend{display:grid;gap:8px;margin-top:12px}
.legend button{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:10px 12px}
.legend button.on{border-color:var(--violet);background:#F1EEFF}
.legend i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--gold);font-weight:800;display:grid;place-items:center;flex-shrink:0}
.legend button.on i{background:var(--violet);color:#fff}
.prompt{position:relative;background:#F5F7FF;border:1.5px solid #D5DDF8;border-radius:18px;padding:16px 16px 14px 20px;white-space:pre-wrap}
.prompt::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--blue)}
.act{display:inline-flex;align-items:center;gap:8px;margin-top:10px;border:0;border-radius:14px;padding:11px 18px;font-weight:800;background:var(--blue);color:#fff;font-size:17px;box-shadow:0 4px 12px rgba(54,87,232,.28)}
.act.ok{background:var(--ok);box-shadow:none}
.dl{display:inline-flex;align-items:center;gap:10px;background:var(--teal);color:#fff;text-decoration:none;border-radius:16px;padding:13px 20px;font-weight:800;box-shadow:0 4px 12px rgba(14,165,160,.28)}
.task{display:flex;gap:14px;align-items:center;background:#fff;border:2px dashed #C9D1E3;border-radius:16px;padding:12px 14px;width:100%;text-align:left;font-weight:700;transition:all .2s}
.task .bx{width:34px;height:34px;border-radius:11px;border:2.5px solid #AEB7CC;flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:20px;transition:all .2s}
.task.on{border-style:solid;border-color:var(--ok);background:#EAF8F1}
.task.on .bx{background:var(--ok);border-color:var(--ok)}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.flip{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:2px solid transparent;border-radius:18px;padding:14px;text-align:left;min-height:118px;transition:all .25s}
.flip .fi{width:40px;height:40px;border-radius:12px;background:#fff;color:var(--violet);display:grid;place-items:center;font-size:21px}
.flip b{line-height:1.3}
.flip .back{display:none;color:var(--soft);font-size:16px;line-height:1.45}
.flip .hint{font-size:14px;color:var(--violet);font-weight:800;margin-top:auto}
.flip.on{background:#F1EEFF;border-color:var(--violet)}
.flip.on .back{display:block}.flip.on .hint{display:none}
h3.sub{font-family:var(--disp);font-weight:600;font-size:18px;margin:24px 0 8px}
.quiz{margin-top:24px;border-radius:22px;padding:18px;background:linear-gradient(180deg,#F1EEFF,#F5F7FF)}
.quiz .qh{display:flex;gap:10px;align-items:flex-start;font-weight:800;font-size:19px;margin-bottom:6px}
.quiz .qh .q{color:var(--violet);font-size:24px;line-height:1;margin-top:2px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:9px 0;transition:all .2s}
.opt .k{width:32px;height:32px;border-radius:10px;background:var(--bg);font-weight:800;display:grid;place-items:center;flex-shrink:0}
.opt:hover{border-color:#B9C3DB}
.opt.ok{border-color:var(--ok);background:#EAF8F1}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:#FDEDEB;animation:shake .4s}.opt.bad .k{background:var(--bad);color:#fff}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.why{font-weight:700;margin-top:6px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;padding:15px 22px;font-weight:800;font-size:18px}
.btn.main{flex:1;background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(27,35,80,.25)}
.btn.main:disabled{background:#CBD2E0;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:#fff;border:2px solid var(--line)}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}.dots i{width:10px;height:10px;border-radius:99px;background:#D3D9E6;transition:all .3s}.dots i.on{width:28px;background:var(--violet)}.dots i.ok{background:var(--teal)}
.stepn{font-weight:800;color:var(--soft);font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-align:center;margin-top:16px}
.need{color:var(--soft);font-size:15px;margin-top:8px;text-align:center}
.final{text-align:center;padding:26px 20px}
.cup{width:150px;height:150px;margin:6px auto 10px;border-radius:50%;display:grid;place-items:center;font-size:72px;color:#fff;background:radial-gradient(circle at 35% 30%,#FFE08A,#E9A824 55%,#B97300);box-shadow:0 14px 34px rgba(233,168,36,.45),inset 0 0 0 8px rgba(255,255,255,.35);animation:pop .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.final h2{font-family:var(--disp);font-weight:700;font-size:24px;line-height:1.25;margin:8px 0}
canvas#cf{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.toast{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.on{opacity:1}
@media (max-width:520px){html,body{font-size:18px}.hero h1{font-size:21px}.lvtop h2{font-size:20px}.lvtop .big{width:62px;height:62px;font-size:30px}.body{padding:4px 14px 16px}.med{width:62px;height:62px;font-size:26px}.route::before{left:38px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

 case 'shot':{const id='s'+Math.random().toString(36).slice(2,7);
  return `<div class="blk"><div class="phone" style="max-width:${b.max||330}px"><div class="scr" id="${id}"><img src="${b.src}" alt="${esc(b.cap||'')}">${b.spots.map((s,k)=>`<button class="spot" style="left:${s[0]}%;top:${s[1]}%" onclick="spot('${id}',${k})" aria-label="${k+1}">${k+1}</button>`).join('')}</div></div><div class="cap">${esc(b.cap||'')}</div><div class="legend" id="${id}L">${b.spots.map((s,k)=>`<button onclick="spot('${id}',${k})"><i>${k+1}</i><span>${s[2]}</span></button>`).join('')}</div></div>`}
 case 'prompt':return `<div class="blk"><div class="prompt">${esc(b.text)}</div><button class="act" onclick="cp(this)" data-t="${esc(b.text)}">${ic('copy')} ${esc(T.copy)}</button></div>`;
 case 'dl':return `<div class="blk"><a class="dl" href="${b.href}" ${b.dl?'download':''} target="_blank" rel="noopener">${ic(b.dl?'down':'open')} ${esc(b.label)}</a>${b.note?`<div class="need" style="text-align:left">${esc(b.note)}</div>`:''}</div>`;
 case 'task':{const on=S.tasks[b.id];return `<div class="blk"><button class="task ${on?'on':''}" aria-pressed="${!!on}" onclick="tk(this,'${b.id}',${li})"><span class="bx">${on?ic('check'):''}</span><span>${b.label}</span></button></div>`}
 case 'flips':return `<div class="blk flips">${b.items.map(x=>`<button class="flip" onclick="this.classList.toggle('on');sendH()"><span class="fi">${ic(x[2]||'bulb')}</span><b>${x[0]}</b><span class="hint">${esc(T.flip)}</span><span class="back">${x[1]}</span></button>`).join('')}</div>`;
 case 'h':return `<h3 class="sub">${b.h}</h3>`;
 }return ''}
function screens(l){const out=[];let cur=null;
 const brk=new Set(['shot','tiles','flips','steps']);
 l.blocks.forEach(b=>{const onlyIntro=cur&&cur.length===1&&cur[0].t==='p';
  if(!cur||b.t==='p'||b.t==='h'||(brk.has(b.t)&&!onlyIntro&&!(cur.length===1&&cur[0].t==='h'))){cur=[b];out.push(cur)}else cur.push(b)});
 if(l.quiz)out.push('quiz');return out}
let STEP=0;
function go(i,st){if(!open(i))return;document.getElementById('toast').classList.remove('on');S.cur=i;save();const l=L[i],cls=l.part===L[0].part?'th':'pr',SC=screens(l);STEP=st==null?0:Math.max(0,Math.min(st,SC.length-1));const sc=SC[STEP],last=STEP===SC.length-1;S.step=STEP;save();
 let h=`<div class="lvtop ${cls}">${ORN}<span class="big">${ic(l.icon)}</span><div><div class="eyebrow">${esc(T.level)} ${i+1} / ${L.length} · ${esc(l.part)}</div><h2>${esc(l.title)}</h2></div></div><div class="body">`;
 h+=`<div class="stepn">${esc(T.step)} ${STEP+1} / ${SC.length}</div><div class="dots">${SC.map((_,k)=>`<i class="${k===STEP?'on':k<STEP?'ok':''}"></i>`).join('')}</div>`;
 if(sc==='quiz')h+=`<div class="quiz"><div class="qh"><span class="q">${ic('help')}</span><span>${esc(l.quiz.q)}</span></div>${l.quiz.opts.map((o,k)=>`<button class="opt" onclick="ans(this,${i},${k})"><span class="k">${'ABC'[k]}</span><span>${esc(o)}</span></button>`).join('')}<div class="why" id="why" aria-live="polite"></div></div>`;
 else h+=sc.map(b=>blk(b,i)).join('');
 const tids=sc==='quiz'?[]:sc.filter(b=>b.t==='task').map(b=>b.id),need=tids.some(x=>!S.tasks[x]);
 const canNext=sc==='quiz'?done(i):!need;
 const nextLbl=last?(i===L.length-1?T.toFinal:T.next):T.further;
 h+=`<div class="nav"><button class="btn ghost" onclick="${STEP>0?`go(${i},${STEP-1})`:'map()'}">${STEP>0?ic('left')+' '+esc(T.back):ic('map')+' '+esc(T.map)}</button><button class="btn main" id="nx" onclick="adv(${i})" ${canNext?'':'disabled'}>${esc(nextLbl)} ${ic('arrow')}</button></div><div class="need" id="need">${canNext?'':esc(sc==='quiz'?T.needQuiz:T.needTasks)}</div></div>`;
 app.innerHTML=hero()+'<div style="height:14px"></div>'+h;window.tries=0;scrollTo(0,0);up();sendH()}
function adv(i){const l=L[i],SC=screens(l);if(STEP<SC.length-1)return go(i,STEP+1);
 if(!l.quiz&&S.stars[l.id]==null){S.stars[l.id]=3;save()}
 if(!l.quiz)toast(3,$('#nx'));setTimeout(()=>next(i),l.quiz?0:700)}
function spot(id,k){document.querySelectorAll('#'+id+' .spot').forEach((s,j)=>s.classList.toggle('on',j===k));document.querySelectorAll('#'+id+'L button').forEach((s,j)=>s.classList.toggle('on',j===k))}
function cp(b){const t=b.dataset.t;const okf=()=>{b.classList.add('ok');b.innerHTML=ic('check')+' '+esc(T.copied);setTimeout(()=>{b.classList.remove('ok');b.innerHTML=ic('copy')+' '+esc(T.copy)},1800)};
 const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');okf()}catch(e){}a.remove()};
 if(navigator.clipboard&&isSecureContext)navigator.clipboard.writeText(t).then(okf,fb);else fb()}
const setPill=()=>{const p=$('#sc');if(p)p.textContent=total()+' / '+max;const g=document.querySelector('.prog i');if(g)g.style.width=Math.round(total()/max*100)+'%'};
function tk(b,id,i){S.tasks[id]=!S.tasks[id];b.classList.toggle('on',!!S.tasks[id]);b.setAttribute('aria-pressed',!!S.tasks[id]);b.querySelector('.bx').innerHTML=S.tasks[id]?ic('check'):'';save();
 const sc=screens(L[i])[STEP],ok=sc.filter(x=>x.t==='task').every(x=>S.tasks[x.id]);$('#nx').disabled=!ok;$('#need').textContent=ok?'':T.needTasks}
function ans(b,i,k){const l=L[i],q=l.quiz;if(document.querySelector('.opt.ok'))return;
 if(k===q.ok){b.classList.add('ok');const s=Math.max(1,3-window.tries);if(S.stars[l.id]==null||S.stars[l.id]<s)S.stars[l.id]=s;save();
  $('#why').textContent=q.why;$('#nx').disabled=false;$('#need').textContent='';toast(S.stars[l.id],b);setPill()}
 else{window.tries++;b.classList.add('bad');$('#why').textContent=T.tryAgain;setTimeout(()=>b.classList.remove('bad'),600)}sendH()}
function next(i){if(i<L.length-1)go(i+1);else final()}
function final(){if(!L.every((_,i)=>done(i)))return map();
 app.innerHTML=hero()+`<div style="height:14px"></div><div class="body final"><div class="cup">${ic('trophy')}</div><h2>${esc(T.finalTitle)}</h2><p>${esc(T.finalText.replace('{s}',total()).replace('{m}',max))}</p><div class="blk note info" style="text-align:left"><span class="ni">${ic('pen')}</span><div>${T.homework}</div></div><div class="nav"><button class="btn ghost" onclick="map()">${ic('map')} ${esc(T.map)}</button><button class="btn ghost" onclick="if(confirm('${esc(T.resetQ)}')){S={stars:{},tasks:{},cur:null};save();map()}">${ic('redo')} ${esc(T.reset)}</button></div></div>`;
 scrollTo(0,0);up();sendH();confetti()}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('canvas');c.id='cf';const W=c.width=innerWidth,H=c.height=Math.min(document.body.scrollHeight,900);c.style.height=H+'px';document.body.appendChild(c);const x=c.getContext('2d');
 const cols=['#E9A824','#3657E8','#0EA5A0','#7B61FF','#E0569B'],P=Array.from({length:120},()=>({x:W/2,y:H*0.3,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:Math.random()*6+4,c:cols[Math.random()*5|0],r:Math.random()*6}));let f=0;
 (function tick(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<150)requestAnimationFrame(tick);else c.remove()})()}
if(S.cur!=null&&open(S.cur))go(S.cur,S.step||0);else map();ready=true;
</script>
</body>
