 --disp:"Nunito Sans",system-ui,sans-serif;--body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--r:22px;--sh:0 1px 2px rgba(27,35,80,.06),0 8px 24px rgba(27,35,80,.07)}

try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s), app=$('#app');
const total=()=>L.reduce((a,l)=>a+(S.stars[l.id]||0),0), max=L.length*3;
const done=i=>!!L[i]&&S.stars[L[i].id]!=null, open=i=>i===0||done(i-1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ready=false;const up=()=>{if(!ready)return;try{parent.postMessage({aiGameTop:1},'*')}catch(e){}};
const sendH=()=>{try{parent.postMessage({aiGameHeight:document.body.scrollHeight},'*')}catch(e){}};
new ResizeObserver(sendH).observe(document.body);addEventListener('load',()=>{sendH();setTimeout(sendH,600);setTimeout(sendH,1600)});
const stars3=n=>`<span class="stars3">${[0,1,2].map(k=>`<span class="${k<n?'on':'off'}">${STAR}</span>`).join('')}</span>`;
function toast(n,el){const t=$('#toast');t.innerHTML=`${stars3(n)} ${esc(T.great)}`;const r=(el||document.body).getBoundingClientRect();t.style.top=(r.top+scrollY-54)+'px';t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1900)}
function hero(){const p=Math.round(total()/max*100);return `<div class="hero">${ORN}<div class="eyebrow">${esc(T.eyebrow)}</div><h1>${esc(T.hero)}</h1><div class="hrow"><span class="pill"><span class="st">${STAR}</span> <span id="sc">${total()} / ${max}</span></span><div class="prog" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div></div></div>`}
function map(){document.getElementById('toast').classList.remove('on');S.cur=null;save();let h=hero(),part='',first=L.findIndex((_,i)=>open(i)&&!done(i));
 L.forEach((l,i)=>{if(l.part!==part){if(part)h+='</div>';part=l.part;h+=`<div class="sect">${esc(part)}</div><div class="route">`}
  const d=done(i),o=open(i),cls=(l.part===L[0].part?'th':'pr')+(d?' done':'')+(o?'':' lock')+(i===first?' now':'');
  h+=`<button class="node ${cls}" ${o?'':'disabled'} onclick="go(${i})"><span class="med">${ic(o?(d?'check':l.icon):'lock')}</span><span class="lab"><b>${i+1}. ${esc(l.title)}</b><small>${d?stars3(S.stars[l.id]):o?esc(T.start)+' '+ic('arrow'):esc(T.locked)}</small></span></button>`});
 h+='</div>';const fin=L.every((_,i)=>done(i));
 h+=`<div class="sect">${esc(T.finish)}</div><div class="route"><button class="node fin ${fin?'done now':'lock'}" ${fin?'':'disabled'} onclick="final()"><span class="med">${ic(fin?'trophy':'lock')}</span><span class="lab"><b>${esc(T.finalTitle)}</b><small>${esc(fin?T.start:T.finalLocked)}</small></span></button></div>`;
 app.innerHTML=h;scrollTo(0,0);up();sendH()}
function blk(b,li){switch(b.t){
 case 'p':return `<div class="blk"><p>${b.h}</p></div>`;
 case 'warn':return `<div class="blk note warn"><span class="ni">${ic(b.i||'alert')}</span><div>${b.h}</div></div>`;
 case 'info':return `<div class="blk note info"><span class="ni">${ic(b.i||'info')}</span><div>${b.h}</div></div>`;
 case 'tiles':return `<div class="blk tiles ${b.items.length%3&&b.items.length%2===0?'c2':''}">${b.items.map(x=>`<div class="tile ${b.neg?'neg':''}"><span class="ti">${ic(x[0])}</span><div><b>${x[1]}</b><span>${x[2]}</span></div></div>`).join('')}</div>`;
 case 'steps':return `<div class="blk"><ol class="steps">${b.items.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
 case 'shot':{const id='s'+Math.random().toString(36).slice(2,7);
  return `<div class="blk"><div class="phone" style="max-width:${b.max||330}px"><div class="scr" id="${id}"><img src="${b.src}" alt="${esc(b.cap||'')}">${b.spots.map((s,k)=>`<button class="spot" style="left:${s[0]}%;top:${s[1]}%" onclick="spot('${id}',${k})" aria-label="${k+1}">${k+1}</button>`).join('')}</div></div><div class="cap">${esc(b.cap||'')}</div><div class="legend" id="${id}L">${b.spots.map((s,k)=>`<button onclick="spot('${id}',${k})"><i>${k+1}</i><span>${s[2]}</span></button>`).join('')}</div></div>`}
 case 'prompt':return `<div class="blk"><div class="prompt">${esc(b.text)}</div><button class="act" onclick="cp(this)" data-t="${esc(b.text)}">${ic('copy')} ${esc(T.copy)}</button></div>`;
 case 'dl':return `<div class="blk"><a class="dl" href="${b.href}" ${b.dl?'download':''} target="_blank" rel="noopener">${ic(b.dl?'down':'open')} ${esc(b.label)}</a>${b.note?`<div class="need" style="text-align:left">${esc(b.note)}</div>`:''}</div>`;
 case 'task':{const on=S.tasks[b.id];return `<div class="blk"><button class="task ${on?'on':''}" aria-pressed="${!!on}" onclick="tk(this,'${b.id}',${li})"><span class="bx">${on?ic('check'):''}</span><span>${b.label}</span></button></div>`}
 case 'flips':return `<div class="blk flips ${b.items.length%3&&b.items.length%2===0?'c2':''}">${b.items.map(x=>`<button class="flip" onclick="this.classList.toggle('on');sendH()"><span class="fi">${ic(x[2]||'bulb')}</span><b>${x[0]}</b><span class="hint">${esc(T.flip)}</span><span class="back">${x[1]}</span></button>`).join('')}</div>`;
 case 'h':return `<h3 class="sub">${b.h}</h3>`;
 case 'img':return `<div class="blk refimg"><img src="${b.src}" alt="${esc(b.cap||'')}"><div class="cap">${esc(b.cap||'')}</div>${b.dl?`<a class="dl" href="${b.src}" download target="_blank" rel="noopener">${ic('down')} ${esc(b.dl)}</a>`:''}</div>`;
 }return ''}
function screens(l){const out=[];let cur=null;l.blocks.forEach(b=>{if(!cur||b.t==='h'){cur=[b];out.push(cur)}else cur.push(b)});if(l.quiz)out.push('quiz');return out}
let STEP=0;
function go(i,st){if(!open(i))return;document.getElementById('toast').classList.remove('on');S.cur=i;save();const l=L[i],cls=l.part===L[0].part?'th':'pr',SC=screens(l);STEP=st==null?0:Math.max(0,Math.min(st,SC.length-1));const sc=SC[STEP],last=STEP===SC.length-1;S.step=STEP;save();
 let h=`<div class="lvtop ${cls}">${ORN}<span class="big">${ic(l.icon)}</span><div><div class="eyebrow">${esc(T.level)} ${i+1} / ${L.length} · ${esc(l.part)}</div><h2>${esc(l.title)}</h2></div></div><div class="body">`;
 h+=`<div class="stepn">${esc(T.step)} ${STEP+1} / ${SC.length}</div><div class="dots">${SC.map((_,k)=>`<i class="${k===STEP?'on':k<STEP?'ok':''}"></i>`).join('')}</div>`;
 if(sc==='quiz')h+=`<div class="quiz"><div class="qh"><span class="q">${ic('help')}</span><span>${esc(l.quiz.q)}</span></div>${l.quiz.opts.map((o,k)=>`<button class="opt" onclick="ans(this,${i},${k})"><span class="k">${'ABC'[k]}</span><span>${esc(o)}</span></button>`).join('')}<div class="why" id="why" aria-live="polite"></div></div>`;
 else h+=sc.map(b=>blk(b,i)).join('');
 const tids=sc==='quiz'?[]:sc.filter(b=>b.t==='task').map(b=>b.id),need=tids.some(x=>!S.tasks[x]);
 const canNext=sc==='quiz'?done(i):!need;
 const nextLbl=last?(i===L.length-1?T.toFinal:T.next):T.further;
 h+=`<div class="nav"><button class="btn ghost" onclick="${STEP>0?`go(${i},${STEP-1})`:'map()'}">${STEP>0?ic('left')+' '+esc(T.back):ic('map')+' '+esc(T.map)}</button><button class="btn main" id="nx" onclick="adv(${i})" ${canNext?'':'disabled'}>${esc(nextLbl)} ${ic('arrow')}</button></div><div class="need" id="need">${canNext?'':esc(sc==='quiz'?T.needQuiz:T.needTasks)}</div></div>`;
 app.innerHTML=hero()+'<div style="height:14px"></div>'+h;window.tries=0;scrollTo(0,0);up();sendH()}
function adv(i){const l=L[i],SC=screens(l);if(STEP<SC.length-1)return go(i,STEP+1);
 if(!l.quiz&&S.stars[l.id]==null){S.stars[l.id]=3;save()}
 if(!l.quiz)toast(3,$('#nx'));setTimeout(()=>next(i),l.quiz?0:700)}
function spot(id,k){document.querySelectorAll('#'+id+' .spot').forEach((s,j)=>s.classList.toggle('on',j===k));document.querySelectorAll('#'+id+'L button').forEach((s,j)=>s.classList.toggle('on',j===k))}
function cp(b){const t=b.dataset.t;const okf=()=>{b.classList.add('ok');b.innerHTML=ic('check')+' '+esc(T.copied);setTimeout(()=>{b.classList.remove('ok');b.innerHTML=ic('copy')+' '+esc(T.copy)},1800)};
 const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');okf()}catch(e){}a.remove()};
 if(navigator.clipboard&&isSecureContext)navigator.clipboard.writeText(t).then(okf,fb);else fb()}
const setPill=()=>{const p=$('#sc');if(p)p.textContent=total()+' / '+max;const g=document.querySelector('.prog i');if(g)g.style.width=Math.round(total()/max*100)+'%'};
function tk(b,id,i){S.tasks[id]=!S.tasks[id];b.classList.toggle('on',!!S.tasks[id]);b.setAttribute('aria-pressed',!!S.tasks[id]);b.querySelector('.bx').innerHTML=S.tasks[id]?ic('check'):'';save();
 const sc=screens(L[i])[STEP],ok=sc.filter(x=>x.t==='task').every(x=>S.tasks[x.id]);$('#nx').disabled=!ok;$('#need').textContent=ok?'':T.needTasks}
function ans(b,i,k){const l=L[i],q=l.quiz;if(document.querySelector('.opt.ok'))return;
 if(k===q.ok){b.classList.add('ok');const s=Math.max(1,3-window.tries);if(S.stars[l.id]==null||S.stars[l.id]<s)S.stars[l.id]=s;save();
  $('#why').textContent=q.why;$('#nx').disabled=false;$('#need').textContent='';toast(S.stars[l.id],b);setPill()}
 else{window.tries++;b.classList.add('bad');$('#why').textContent=T.tryAgain;setTimeout(()=>b.classList.remove('bad'),600)}sendH()}
function next(i){if(i<L.length-1)go(i+1);else final()}
function final(){if(!L.every((_,i)=>done(i)))return map();
 app.innerHTML=hero()+`<div style="height:14px"></div><div class="body final"><div class="cup">${ic('trophy')}</div><h2>${esc(T.finalTitle)}</h2><p>${esc(T.finalText.replace('{s}',total()).replace('{m}',max))}</p><div class="blk note info" style="text-align:left"><span class="ni">${ic('pen')}</span><div>${T.homework}</div></div><div class="nav"><button class="btn ghost" onclick="map()">${ic('map')} ${esc(T.map)}</button><button class="btn ghost" onclick="if(confirm('${esc(T.resetQ)}')){S={stars:{},tasks:{},cur:null};save();map()}">${ic('redo')} ${esc(T.reset)}</button></div></div>`;
 scrollTo(0,0);up();sendH();confetti()}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('canvas');c.id='cf';const W=c.width=innerWidth,H=c.height=Math.min(document.body.scrollHeight,900);c.style.height=H+'px';document.body.appendChild(c);const x=c.getContext('2d');
 const cols=['#E9A824','#3657E8','#0EA5A0','#7B61FF','#E0569B'],P=Array.from({length:120},()=>({x:W/2,y:H*0.3,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:Math.random()*6+4,c:cols[Math.random()*5|0],r:Math.random()*6}));let f=0;
 (function tick(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<150)requestAnimationFrame(tick);else c.remove()})()}
if(S.cur!=null&&S.cur>=0&&S.cur<L.length&&open(S.cur))go(S.cur,S.step||0);else map();ready=true;
</script>
</body>
</html>
